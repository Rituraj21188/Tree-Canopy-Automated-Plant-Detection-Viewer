<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Tea Plantation Sentinel | Canopy & Spatial Analytics</title>
  
  <!-- Leaflet & FontAwesome -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    :root {
      --bg: #030712;
      --card-bg: rgba(10, 15, 29, 0.85);
      --border: rgba(56, 189, 248, 0.2);
      --border-glow: rgba(56, 189, 248, 0.4);
      --accent: #10b981;
      --neon-green: #00ff9d;
      --neon-amber: #f59e0b;
      --neon-cyan: #00f0ff;
      --text: #f8fafc;
      --muted: #94a3b8;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; }
    html, body { width: 100%; height: 100%; height: 100dvh; background: var(--bg); color: var(--text); overflow: hidden; }

    #map {
      width: 100%; height: 100%;
      background: #020408;
    }

    /* Holographic Grid Overlay */
    .grid-overlay {
      position: absolute; inset: 0; pointer-events: none; z-index: 400;
      background-image: 
        linear-gradient(rgba(0, 240, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 240, 255, 0.03) 1px, transparent 1px);
      background-size: 50px 50px;
    }

    /* Reticle Targets */
    .reticle {
      position: absolute; width: 18px; height: 18px; border: 2px solid var(--neon-cyan);
      pointer-events: none; z-index: 500; opacity: 0.6;
    }
    .reticle-tl { top: 20px; left: 20px; border-right: none; border-bottom: none; }
    .reticle-tr { top: 20px; right: 20px; border-left: none; border-bottom: none; }
    .reticle-bl { bottom: 20px; left: 20px; border-right: none; border-top: none; }
    .reticle-br { bottom: 20px; right: 20px; border-left: none; border-top: none; }

    /* Top Left HUD */
    .hud-title {
      position: absolute; top: max(16px, env(safe-area-inset-top)); left: max(16px, env(safe-area-inset-left)); z-index: 1000;
      background: var(--card-bg); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border); border-radius: 12px; padding: 12px 18px;
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.1), inset 0 0 15px rgba(0, 240, 255, 0.05);
    }
    .hud-title h1 { 
      font-size: 14px; font-weight: 800; letter-spacing: 1px; display: flex; align-items: center; gap: 8px; text-transform: uppercase;
      background: linear-gradient(90deg, #fff, var(--neon-cyan)); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .hud-title span { display: block; font-size: 10px; color: var(--muted); margin-top: 3px; letter-spacing: 0.8px; }

    /* Control Deck */
    .ai-suite {
      position: absolute; top: max(16px, env(safe-area-inset-top)); right: max(16px, env(safe-area-inset-right)); z-index: 1000;
      width: 320px; background: var(--card-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border); border-radius: 16px; padding: 18px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8), 0 0 25px rgba(0, 240, 255, 0.1);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .suite-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; cursor: pointer; }
    .suite-header h3 { font-size: 11px; text-transform: uppercase; letter-spacing: 2px; color: var(--neon-cyan); font-weight: 800; }
    .pulse-indicator { 
      width: 8px; height: 8px; border-radius: 50%; background: var(--neon-green); 
      box-shadow: 0 0 12px var(--neon-green); animation: pulse 1.8s infinite; 
    }

    /* Layer Switches */
    .layer-controls {
      display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px;
      background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 8px; padding: 8px;
    }
    .toggle-row {
      display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: #cbd5e1;
    }
    .toggle-row input[type="checkbox"] { accent-color: var(--neon-cyan); cursor: pointer; }

    /* Unit Selector */
    .unit-control {
      margin-bottom: 10px;
      background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px; padding: 6px 10px; display: flex; justify-content: space-between; align-items: center;
    }
    .unit-control label { font-size: 10px; text-transform: uppercase; color: var(--muted); letter-spacing: 0.8px; }
    .unit-select {
      background: #090e1a; color: var(--neon-cyan); border: 1px solid var(--border);
      border-radius: 5px; font-size: 11px; font-weight: 700; padding: 3px 6px; outline: none; cursor: pointer;
    }

    /* Stats Grid */
    .stats-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 6px;
    }
    .stat-card {
      background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 8px; padding: 10px; text-align: center; position: relative; overflow: hidden;
    }
    .stat-card::after {
      content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 2px;
      background: linear-gradient(90deg, transparent, var(--neon-cyan), transparent);
    }
    .stat-card span { font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.8px; }
    .stat-card strong { display: block; font-size: 13.5px; color: #fff; margin-top: 3px; font-weight: 800; font-family: monospace; }
    .stat-green strong { color: var(--neon-green); text-shadow: 0 0 10px rgba(0, 255, 157, 0.4); }
    .stat-amber strong { color: var(--neon-amber); text-shadow: 0 0 10px rgba(245, 158, 11, 0.4); }

    .action-row { display: flex; gap: 8px; margin-top: 12px; }
    .action-btn {
      flex: 1; background: #0f172a; color: #cbd5e1; border: 1px solid var(--border);
      padding: 9px; font-size: 10px; font-weight: 700; border-radius: 6px; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 6px; text-transform: uppercase;
      letter-spacing: 0.5px; transition: all 0.2s;
    }
    .action-btn:hover { background: #1e293b; color: #fff; border-color: var(--neon-cyan); }

    /* Bottom HUD status */
    .hud-bottom {
      position: absolute; bottom: max(20px, env(safe-area-inset-bottom)); left: max(16px, env(safe-area-inset-left)); z-index: 1000;
      background: var(--card-bg); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border); border-radius: 10px; padding: 9px 14px;
      font-size: 11px; display: flex; align-items: center; gap: 16px; font-family: monospace;
    }
    .hud-bottom span { color: var(--muted); }

    @keyframes pulse {
      0%, 100% { transform: scale(0.9); opacity: 0.5; }
      50% { transform: scale(1.2); opacity: 1; }
    }

    @media (max-width: 768px) {
      .hud-title { padding: 8px 12px; }
      .hud-title h1 { font-size: 11px; }
      .hud-title span { display: none; }
      .reticle { display: none; }

      .ai-suite {
        top: auto; bottom: 0; left: 0; right: 0; width: 100%;
        border-radius: 20px 20px 0 0; padding: 16px 16px max(14px, env(safe-area-inset-bottom));
        max-height: 80vh;
      }
      .ai-suite.collapsed .suite-body { display: none; }
      .ai-suite.collapsed { padding-bottom: max(12px, env(safe-area-inset-bottom)); }

      .hud-bottom {
        bottom: auto; top: calc(max(16px, env(safe-area-inset-top)) + 46px);
        left: max(16px, env(safe-area-inset-left)); right: max(16px, env(safe-area-inset-right));
        font-size: 10px;
      }
    }
  </style>
</head>
<body>

  <div id="map"></div>
  <div class="grid-overlay"></div>
  <div class="reticle reticle-tl"></div>
  <div class="reticle reticle-tr"></div>
  <div class="reticle reticle-bl"></div>
  <div class="reticle reticle-br"></div>

  <div class="hud-title">
    <h1><i class="fa-solid fa-layer-group"></i> Tea Plantation Sentinel</h1>
    <span>EPSG:4326 / 3857 · Precision Orthomosaic Analytics</span>
  </div>

  <div class="ai-suite" id="aiSuite">
    <div class="suite-header" onclick="toggleSuite()">
      <h3>Spatial Deck</h3>
      <div style="display:flex; align-items:center; gap:8px;">
        <div class="pulse-indicator"></div>
        <i class="fa-solid fa-chevron-down" id="suiteToggleIcon" style="font-size:11px; color:var(--muted);"></i>
      </div>
    </div>

    <div class="suite-body">
      <!-- Layer Toggle Controls -->
      <div class="layer-controls">
        <label class="toggle-row">
          <span><i class="fa-solid fa-draw-polygon" style="color:var(--neon-cyan); margin-right:6px;"></i> Garden Boundary</span>
          <input type="checkbox" id="chkBoundary" checked onchange="toggleLayer('boundary', this.checked)">
        </label>
        <label class="toggle-row">
          <span><i class="fa-solid fa-border-all" style="color:var(--neon-amber); margin-right:6px;"></i> Empty Patches</span>
          <input type="checkbox" id="chkGaps" checked onchange="toggleLayer('gaps', this.checked)">
        </label>
        <label class="toggle-row">
          <span><i class="fa-solid fa-tree" style="color:var(--neon-green); margin-right:6px;"></i> Trees</span>
          <input type="checkbox" id="chkTrees" checked onchange="toggleLayer('trees', this.checked)">
        </label>
      </div>

      <!-- Measurement Unit Selector -->
      <div class="unit-control">
        <label><i class="fa-solid fa-ruler-combined"></i> Area Unit</label>
        <select id="unitSelector" class="unit-select" onchange="updateAreaDisplays()">
          <option value="sqm">Sq. Meters (m²)</option>
          <option value="ha">Hectares (Ha)</option>
          <option value="acre">Acres</option>
          <option value="assam_dlr" selected>Assam (B-K-L)</option>
          <option value="bigha_dec">Bigha (Decimal)</option>
        </select>
      </div>

      <!-- Live Analytics Stats -->
      <div class="stats-grid">
        <div class="stat-card stat-green">
          <span>Trees</span>
          <strong id="statTreeCount">0</strong>
        </div>
        <div class="stat-card stat-amber">
          <span>Empty Patches</span>
          <strong id="statGapCount">0</strong>
        </div>
        <div class="stat-card">
          <span>Plantable Patch Area</span>
          <strong id="statGapArea">0 m²</strong>
        </div>
        <div class="stat-card">
          <span>Boundary Area</span>
          <strong id="statBoundaryArea">0 m²</strong>
        </div>
      </div>

      <div class="action-row">
        <button class="action-btn" onclick="zoomToBoundary()"><i class="fa-solid fa-expand"></i> Fit Site</button>
        <button class="action-btn" onclick="reloadLayers()"><i class="fa-solid fa-rotate-right"></i> Reload</button>
      </div>
    </div>
  </div>

  <div class="hud-bottom">
    <div id="coords-text">Lat: 27.06029 | Lng: 94.86607 | Z: 18</div>
    <div style="display:flex; align-items:center; gap:8px;">
      <span>Alpha:</span>
      <input type="range" min="0" max="1" step="0.05" value="1" style="accent-color: var(--neon-cyan); width: 65px;" oninput="orthoLayer.setOpacity(this.value)">
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    function toggleSuite() {
      if (window.innerWidth <= 768) {
        const suite = document.getElementById('aiSuite');
        const icon = document.getElementById('suiteToggleIcon');
        suite.classList.toggle('collapsed');
        icon.className = suite.classList.contains('collapsed') ? 'fa-solid fa-chevron-up' : 'fa-solid fa-chevron-down';
      }
    }

    const SW_CORNER = [27.05936781688538, 94.86518823860000];
    const NE_CORNER = [27.06121598240000, 94.86694912656071];
    const SITE_BOUNDS = L.latLngBounds(SW_CORNER, NE_CORNER);
    const SITE_CENTER = [(SW_CORNER[0] + NE_CORNER[0]) / 2, (SW_CORNER[1] + NE_CORNER[1]) / 2];

    const map = L.map('map', {
      center: SITE_CENTER,
      zoom: 18,
      minZoom: 14,
      maxZoom: 22,
      zoomControl: false,
      attributionControl: false
    });

    const orthoLayer = L.tileLayer('./tea/{z}/{x}/{y}.png', {
      minZoom: 14,
      maxNativeZoom: 19,
      maxZoom: 22,
      tms: true,
      bounds: SITE_BOUNDS
    }).addTo(map);

    map.on('mousemove', (e) => {
      document.getElementById('coords-text').innerText = 
        `Lat: ${e.latlng.lat.toFixed(5)} | Lng: ${e.latlng.lng.toFixed(5)} | Z: ${map.getZoom()}`;
    });

    // Stored raw areas in square meters
    let rawBoundaryAreaSqM = 0;
    let rawGapAreaSqM = 0;

    // Vector Layer Groups
    let boundaryLayer = L.geoJSON(null, {
      style: {
        color: '#00f0ff',
        weight: 2.5,
        fillColor: '#00f0ff',
        fillOpacity: 0.08,
        dashArray: '5, 5'
      },
      onEachFeature: (feature, layer) => {
        layer.bindPopup(`<b style="color:#0284c7;">Plot Boundary</b><br/>Garden Perimeter Area`);
      }
    }).addTo(map);

    let emptyPatchLayer = L.geoJSON(null, {
      style: {
        color: '#f59e0b',
        weight: 2,
        fillColor: '#f59e0b',
        fillOpacity: 0.35,
        dashArray: '4, 4'
      },
      onEachFeature: (feature, layer) => {
        layer.bindPopup(`<b style="color:#d97706;">Empty Plantable Patch</b><br/>Ready for Bamboo / Tea Infill`);
      }
    }).addTo(map);

    let treeLayer = L.geoJSON(null, {
      pointToLayer: (feature, latlng) => {
        return L.circleMarker(latlng, {
          radius: 5,
          fillColor: "#00ff9d",
          color: "#059669",
          weight: 1.5,
          opacity: 1,
          fillOpacity: 0.85
        });
      },
      onEachFeature: (feature, layer) => {
        const id = feature.properties ? (feature.properties.id || feature.properties.fid || '') : '';
        layer.bindPopup(`<b style="color:#059669;">Tree Crown</b><br/>Tree ID: ${id || 'Marked'}`);
      }
    }).addTo(map);

    // Assam DLR & Standard Area Unit Converter
    // 1 Bigha (Assam) = 14,400 sq ft = 1,337.8038 sq m
    // 1 Bigha = 5 Katha (1 Katha = 267.56 sq m)
    // 1 Katha = 20 Lessa (1 Lessa = 13.378 sq m)
    function formatAreaByUnit(sqmMeters, unit) {
      if (!sqmMeters || sqmMeters <= 0) return `0 ${unit}`;

      switch (unit) {
        case 'sqm':
          return `${Math.round(sqmMeters).toLocaleString()} m²`;

        case 'ha':
          return `${(sqmMeters / 10000).toFixed(3)} Ha`;

        case 'acre':
          return `${(sqmMeters / 4046.8564224).toFixed(3)} Acres`;

        case 'bigha_dec': {
          const bigha = sqmMeters / 1337.8038;
          return `${bigha.toFixed(2)} Bigha`;
        }

        case 'assam_dlr': {
          const SQM_PER_BIGHA = 1337.8038;
          const SQM_PER_KATHA = 267.56076;
          const SQM_PER_LESSA = 13.378038;

          let rem = sqmMeters;
          const bigha = Math.floor(rem / SQM_PER_BIGHA);
          rem %= SQM_PER_BIGHA;

          const katha = Math.floor(rem / SQM_PER_KATHA);
          rem %= SQM_PER_KATHA;

          const lessa = (rem / SQM_PER_LESSA).toFixed(1);

          return `${bigha}B - ${katha}K - ${lessa}L`;
        }

        default:
          return `${Math.round(sqmMeters).toLocaleString()} m²`;
      }
    }

    function updateAreaDisplays() {
      const selectedUnit = document.getElementById('unitSelector').value;
      document.getElementById('statBoundaryArea').innerText = formatAreaByUnit(rawBoundaryAreaSqM, selectedUnit);
      document.getElementById('statGapArea').innerText = formatAreaByUnit(rawGapAreaSqM, selectedUnit);
    }

    // Geodesic Polygon Area Calculation in m²
    function calculatePolyArea(coords) {
      if (!coords || coords.length < 3) return 0;
      let area = 0;
      const radius = 6378137;
      for (let i = 0; i < coords.length; i++) {
        let p1 = coords[i];
        let p2 = coords[(i + 1) % coords.length];
        let lon1 = p1[0] * Math.PI / 180;
        let lat1 = p1[1] * Math.PI / 180;
        let lon2 = p2[0] * Math.PI / 180;
        let lat2 = p2[1] * Math.PI / 180;
        area += (lon2 - lon1) * (2 + Math.sin(lat1) + Math.sin(lat2));
      }
      area = Math.abs(area * radius * radius / 2.0);
      return area;
    }

    function computeLayerArea(geojsonData) {
      let totalArea = 0;
      if (!geojsonData || !geojsonData.features) return 0;
      geojsonData.features.forEach(f => {
        if (f.geometry && (f.geometry.type === 'Polygon' || f.geometry.type === 'MultiPolygon')) {
          const polys = f.geometry.type === 'Polygon' ? [f.geometry.coordinates] : f.geometry.coordinates;
          polys.forEach(ring => {
            totalArea += calculatePolyArea(ring[0]);
          });
        }
      });
      return totalArea;
    }

    // Load GeoJSON Layers
    async function loadGeoJSONData() {
      try {
        const boundaryRes = await fetch('./Boundary.geojson');
        if (boundaryRes.ok) {
          const boundaryData = await boundaryRes.json();
          boundaryLayer.clearLayers();
          boundaryLayer.addData(boundaryData);
          rawBoundaryAreaSqM = computeLayerArea(boundaryData);
          if (boundaryLayer.getBounds().isValid()) {
            map.fitBounds(boundaryLayer.getBounds());
          }
        }
      } catch (e) {
        console.warn('Could not load Boundary.geojson:', e);
      }

      try {
        const patchRes = await fetch('./Empty_Patch.geojson');
        if (patchRes.ok) {
          const patchData = await patchRes.json();
          emptyPatchLayer.clearLayers();
          emptyPatchLayer.addData(patchData);
          document.getElementById('statGapCount').innerText = patchData.features ? patchData.features.length : 0;
          rawGapAreaSqM = computeLayerArea(patchData);
        }
      } catch (e) {
        console.warn('Could not load Empty_Patch.geojson:', e);
      }

      try {
        const treeRes = await fetch('./Tree.geojson');
        if (treeRes.ok) {
          const treeData = await treeRes.json();
          treeLayer.clearLayers();
          treeLayer.addData(treeData);
          document.getElementById('statTreeCount').innerText = treeData.features ? treeData.features.length : 0;
        }
      } catch (e) {
        console.warn('Could not load Tree.geojson:', e);
      }

      updateAreaDisplays();
    }

    function toggleLayer(layerName, state) {
      if (layerName === 'boundary') {
        state ? map.addLayer(boundaryLayer) : map.removeLayer(boundaryLayer);
      } else if (layerName === 'gaps') {
        state ? map.addLayer(emptyPatchLayer) : map.removeLayer(emptyPatchLayer);
      } else if (layerName === 'trees') {
        state ? map.addLayer(treeLayer) : map.removeLayer(treeLayer);
      }
    }

    function zoomToBoundary() {
      if (boundaryLayer.getLayers().length > 0 && boundaryLayer.getBounds().isValid()) {
        map.fitBounds(boundaryLayer.getBounds());
      } else {
        map.fitBounds(SITE_BOUNDS);
      }
    }

    function reloadLayers() {
      loadGeoJSONData();
    }

    loadGeoJSONData();
  </script>
</body>
</html>
