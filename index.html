<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Tea Garden AI Canopy Detection | Rituraj Gogoi</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    :root {
      --bg: #07090e;
      --card-bg: rgba(13, 17, 26, 0.92);
      --border: rgba(255, 255, 255, 0.1);
      --accent: #10b981;
      --neon: #34d399;
      --cyan: #38bdf8;
      --text: #f8fafc;
      --muted: #94a3b8;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    html, body { width: 100%; height: 100%; height: 100dvh; background: var(--bg); color: var(--text); overflow: hidden; }

    /* Spatial Canvas Map */
    #map {
      width: 100%; height: 100%;
      background: #05070a;
      background-image: 
        radial-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px),
        linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 40px 40px, 120px 120px, 120px 120px;
    }

    /* Top Left HUD */
    .hud-title {
      position: absolute; top: max(16px, env(safe-area-inset-top)); left: max(16px, env(safe-area-inset-left)); z-index: 1000;
      background: var(--card-bg); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--border); border-radius: 12px; padding: 12px 18px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      max-width: calc(100vw - 32px);
    }
    .hud-title h1 { font-size: 15px; font-weight: 700; letter-spacing: 0.5px; display: flex; align-items: center; gap: 8px; }
    .hud-title h1 i { color: var(--neon); }
    .hud-title span { display: block; font-size: 11px; color: var(--muted); margin-top: 3px; }

    /* AI Detection Suite */
    .ai-suite {
      position: absolute; top: max(16px, env(safe-area-inset-top)); right: max(16px, env(safe-area-inset-right)); z-index: 1000;
      width: 290px; background: var(--card-bg); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border); border-radius: 14px; padding: 16px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.7);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .suite-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; cursor: pointer; }
    .suite-header h3 { font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--neon); font-weight: 700; }
    .suite-header-actions { display: flex; align-items: center; gap: 8px; }
    .toggle-icon { display: none; color: var(--muted); font-size: 12px; }
    .pulse-indicator { width: 8px; height: 8px; border-radius: 50%; background: var(--neon); box-shadow: 0 0 10px var(--neon); animation: pulse 1.8s infinite; }

    .ai-btn-detect {
      width: 100%; background: linear-gradient(135deg, #059669, #10b981);
      color: #fff; border: none; padding: 12px; font-size: 12px; font-weight: 700;
      letter-spacing: 0.5px; border-radius: 8px; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      box-shadow: 0 0 18px rgba(16, 185, 129, 0.4); transition: transform 0.2s, background 0.2s;
      touch-action: manipulation;
    }
    .ai-btn-detect:hover { transform: translateY(-1px); background: linear-gradient(135deg, #10b981, #34d399); }
    .ai-btn-detect:disabled { opacity: 0.65; cursor: not-allowed; transform: none; }

    .control-group { margin-top: 14px; }
    .control-label { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-bottom: 6px; }
    .control-group input[type=range] { width: 100%; height: 20px; accent-color: var(--neon); cursor: pointer; }

    .stats-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px;
    }
    .stat-card {
      background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 8px; padding: 10px; text-align: center;
    }
    .stat-card span { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
    .stat-card strong { display: block; font-size: 18px; color: var(--neon); margin-top: 2px; }

    .action-row { display: flex; gap: 8px; margin-top: 14px; }
    .action-btn {
      flex: 1; background: #1e293b; color: #cbd5e1; border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 10px; font-size: 11px; font-weight: 600; border-radius: 6px; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 5px; transition: background 0.2s;
      touch-action: manipulation;
    }
    .action-btn:hover { background: #334155; color: #fff; }

    /* Bottom HUD */
    .hud-bottom {
      position: absolute; bottom: max(20px, env(safe-area-inset-bottom)); left: max(16px, env(safe-area-inset-left)); z-index: 1000;
      background: var(--card-bg); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px;
      font-size: 11px; display: flex; align-items: center; gap: 16px;
    }
    .hud-bottom span { color: var(--muted); }

    /* Animated Scanning Bar */
    #scanner-line {
      position: absolute; top: 0; left: 0; width: 100%; height: 3px;
      background: linear-gradient(90deg, transparent, #38bdf8, #34d399, transparent);
      box-shadow: 0 0 25px #34d399, 0 0 50px #38bdf8;
      z-index: 600; display: none; pointer-events: none;
    }

    @keyframes scanSweep {
      0% { top: 0%; opacity: 0.3; }
      50% { opacity: 1; }
      100% { top: 100%; opacity: 0.3; }
    }

    .tree-halo {
      border: 2px solid #34d399;
      border-radius: 50%;
      background: rgba(16, 185, 129, 0.22);
      box-shadow: 0 0 14px rgba(52, 211, 153, 0.85);
      animation: treePulse 2s ease-in-out infinite;
    }

    @keyframes treePulse {
      0%, 100% { transform: scale(0.95); opacity: 0.75; }
      50% { transform: scale(1.08); opacity: 1; }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(0.9); opacity: 0.5; }
      50% { transform: scale(1.2); opacity: 1; }
    }

    /* ------------------------------------------------------------- */
    /* RESPONSIVE BREAKPOINTS (Mobile & Tablet Adjustments)           */
    /* ------------------------------------------------------------- */
    @media (max-width: 768px) {
      .hud-title {
        right: max(16px, env(safe-area-inset-right));
        padding: 8px 12px;
      }
      .hud-title h1 { font-size: 13px; }
      .hud-title span { font-size: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

      /* Transform suite into a collapsible bottom card */
      .ai-suite {
        top: auto;
        bottom: 0;
        left: 0;
        right: 0;
        width: 100%;
        border-radius: 16px 16px 0 0;
        padding: 16px 16px max(16px, env(safe-area-inset-bottom));
        max-height: 80vh;
        overflow-y: auto;
      }
      .toggle-icon { display: block; }
      
      .ai-suite.collapsed .suite-body {
        display: none;
      }
      .ai-suite.collapsed {
        padding-bottom: max(12px, env(safe-area-inset-bottom));
      }

      /* Stack and re-position bottom coordinate display */
      .hud-bottom {
        bottom: auto;
        top: calc(max(16px, env(safe-area-inset-top)) + 58px);
        left: max(16px, env(safe-area-inset-left));
        right: max(16px, env(safe-area-inset-right));
        flex-direction: column;
        align-items: flex-start;
        gap: 6px;
        padding: 6px 10px;
        font-size: 10px;
      }
      .hud-bottom div:last-child {
        width: 100%;
        justify-content: space-between;
      }
    }
  </style>
</head>
<body>

  <div id="map"></div>
  <div id="scanner-line"></div>

  <div class="hud-title">
