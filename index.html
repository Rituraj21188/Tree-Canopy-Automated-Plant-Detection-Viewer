<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Tea Garden AI Sentinel | Canopy & Gap Computer Vision</title>
  
  <!-- Leaflet & FontAwesome -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    :root {
      --bg: #030712;
      --card-bg: rgba(10, 15, 29, 0.82);
      --border: rgba(56, 189, 248, 0.2);
      --border-glow: rgba(56, 189, 248, 0.4);
      --accent: #10b981;
      --neon-green: #00ff9d;
      --neon-amber: #f59e0b;
      --neon-cyan: #00f0ff;
      --text: #f8fafc;
      --muted: #94a3b8;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; }
    html, body { width: 100%; height: 100%; height: 100dvh; background: var(--bg); color: var(--text); overflow: hidden; }

    /* Spatial Canvas Map */
    #map {
      width: 100%; height: 100%;
      background: #020408;
    }

    /* Holographic Grid Overlay */
    .grid-overlay {
      position: absolute; inset: 0; pointer-events: none; z-index: 400;
      background-image: 
        linear-gradient(rgba(0, 240, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 240, 255, 0.03) 1px, transparent 1px);
      background-size: 50px 50px;
    }

    /* Reticle Targets in Corners */
    .reticle {
      position: absolute; width: 18px; height: 18px; border: 2px solid var(--neon-cyan);
      pointer-events: none; z-index: 500; opacity: 0.6;
    }
    .reticle-tl { top: 20px; left: 20px; border-right: none; border-bottom: none; }
    .reticle-tr { top: 20px; right: 20px; border-left: none; border-bottom: none; }
    .reticle-bl { bottom: 20px; left: 20px; border-right: none; border-top: none; }
    .reticle-br { bottom: 20px; right: 20px; border-left: none; border-top: none; }

    /* Top Left HUD */
    .hud-title {
      position: absolute; top: max(16px, env(safe-area-inset-top)); left: max(16px, env(safe-area-inset-left)); z-index: 1000;
      background: var(--card-bg); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border); border-radius: 12px; padding: 12px 18px;
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.1), inset 0 0 15px rgba(0, 240, 255, 0.05);
    }
    .hud-title h1 { 
      font-size: 14px; font-weight: 800; letter-spacing: 1px; display: flex; align-items: center; gap: 8px; text-transform: uppercase;
      background: linear-gradient(90deg, #fff, var(--neon-cyan)); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .hud-title span { display: block; font-size: 10px; color: var(--muted); margin-top: 3px; letter-spacing: 0.8px; }

    /* AI Detection Suite Floating Deck */
    .ai-suite {
      position: absolute; top: max(16px, env(safe-area-inset-top)); right: max(16px, env(safe-area-inset-right)); z-index: 1000;
      width: 320px; background: var(--card-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border); border-radius: 16px; padding: 18px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8), 0 0 25px rgba(0, 240, 255, 0.1);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .suite-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; cursor: pointer; }
    .suite-header h3 { font-size: 11px; text-transform: uppercase; letter-spacing: 2px; color: var(--neon-cyan); font-weight: 800; }
    .pulse-indicator { 
      width: 8px; height: 8px; border-radius: 50%; background: var(--neon-green); 
      box-shadow: 0 0 12px var(--neon-green); animation: pulse 1.8s infinite; 
    }

    /* Cyber Button Grid */
    .btn-row { display: flex; gap: 8px; margin-bottom: 12px; }
    .ai-btn-detect {
      flex: 1; background: linear-gradient(135deg, rgba(0, 255, 157, 0.15), rgba(0, 240, 255, 0.25));
      color: #fff; border: 1px solid var(--neon-green); padding: 11px 8px; font-size: 11px; font-weight: 700;
      letter-spacing: 0.8px; border-radius: 8px; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 6px;
      box-shadow: 0 0 15px rgba(0, 255, 157, 0.2); transition: all 0.2s;
      text-transform: uppercase;
    }
    .ai-btn-detect:hover { background: linear-gradient(135deg, rgba(0, 255, 157, 0.3), rgba(0, 240, 255, 0.4)); box-shadow: 0 0 20px rgba(0, 255, 157, 0.4); }
    .ai-btn-gap {
      border-color: var(--neon-amber);
      background: linear-gradient(135deg, rgba(245, 158, 11, 0.15), rgba(239, 68, 68, 0.2));
      box-shadow: 0 0 15px rgba(245, 158, 11, 0.2);
    }
    .ai-btn-gap:hover { background: linear-gradient(135deg, rgba(245, 158, 11, 0.3), rgba(239, 68, 68, 0.35)); box-shadow: 0 0 20px rgba(245, 158, 11, 0.4); }
    .ai-btn-detect:disabled { opacity: 0.5; cursor: not-allowed; }

    .control-group { margin-top: 10px; }
    .control-label { display: flex; justify-content: space-between; font-size: 10px; color: var(--muted); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.8px; }
    .control-group input[type=range] { 
      width: 100%; height: 4px; accent-color: var(--neon-cyan); background: #1e293b; border-radius: 2px; -webkit-appearance: none; 
    }
    .control-group input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: var(--neon-cyan); box-shadow: 0 0 8px var(--neon-cyan);
    }

    /* Stats Grid */
    .stats-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px;
    }
    .stat-card {
      background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 8px; padding: 10px; text-align: center; position: relative; overflow: hidden;
    }
    .stat-card::after {
      content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 2px;
      background: linear-gradient(90deg, transparent, var(--neon-cyan), transparent);
    }
    .stat-card span { font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.8px; }
    .stat-card strong { display: block; font-size: 16px; color: #fff; margin-top: 3px; font-weight: 800; font-family: monospace; }
    .stat-green strong { color: var(--neon-green); text-shadow: 0 0 10px rgba(0, 255, 157, 0.4); }
    .stat-amber strong { color: var(--neon-amber); text-shadow: 0 0 10px rgba(245, 158, 11, 0.4); }

    .action-row { display: flex; gap: 8px; margin-top: 14px; }
    .action-btn {
      flex: 1; background: #0f172a; color: #cbd5e1; border: 1px solid var(--border);
      padding: 9px; font-size: 10px; font-weight: 700; border-radius: 6px; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 6px; text-transform: uppercase;
      letter-spacing: 0.5px; transition: all 0.2s;
    }
    .action-btn:hover { background: #1e293b; color: #fff; border-color: var(--neon-cyan); }

    /* Bottom HUD status */
    .hud-bottom {
      position: absolute; bottom: max(20px, env(safe-area-inset-bottom)); left: max(16px, env(safe-area-inset-left)); z-index: 1000;
      background: var(--card-bg); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border); border-radius: 10px; padding: 9px 14px;
      font-size: 11px; display: flex; align-items: center; gap: 16px; font-family: monospace;
    }
    .hud-bottom span { color: var(--muted); }

    /* Radar Scanning Beam */
    #scanner-line {
      position: absolute; top: 0; left: 0; width: 100%; height: 3px;
      background: linear-gradient(90deg, transparent, var(--neon-cyan), var(--neon-green), transparent);
      box-shadow: 0 0 25px var(--neon-green), 0 0 45px var(--neon-cyan);
      z-index: 600; display: none; pointer-events: none;
    }

    @keyframes scanSweep {
      0% { top: 0%; opacity: 0.3; }
      50% { opacity: 1; }
      100% { top: 100%; opacity: 0.3; }
    }

    .tree-halo {
      border: 2px solid #00ff9d; border-radius: 50%; background: rgba(0, 255, 157, 0.25);
      box-shadow: 0 0 14px rgba(0, 255, 157, 0.8); animation: treePulse 2s ease-in-out infinite;
    }
    .gap-halo {
      border: 2px dashed #f59e0b; border-radius: 6px; background: rgba(245, 158, 11, 0.3);
      box-shadow: 0 0 12px rgba(245, 158, 11, 0.7);
    }

    @keyframes treePulse {
      0%, 100% { transform: scale(0.95); opacity: 0.7; }
      50% { transform: scale(1.08); opacity: 1; }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(0.9); opacity: 0.5; }
      50% { transform: scale(1.2); opacity: 1; }
    }

    /* Mobile Responsive Scaffold */
    @media (max-width: 768px) {
      .hud-title { padding: 8px 12px; }
      .hud-title h1 { font-size: 11px; }
      .hud-title span { display: none; }
      .reticle { display: none; }

      .ai-suite {
        top: auto; bottom: 0; left: 0; right: 0; width: 100%;
        border-radius: 20px 20px 0 0; padding: 16px 16px max(14px, env(safe-area-inset-bottom));
        max-height: 80vh;
      }
      .ai-suite.collapsed .suite-body { display: none; }
      .ai-suite.collapsed { padding-bottom: max(12px, env(safe-area-inset-bottom)); }

      .hud-bottom {
        bottom: auto; top: calc(max(16px, env(safe-area-inset-top)) + 46px);
        left: max(16px, env(safe-area-inset-left)); right: max(16px, env(safe-area-inset-right));
        font-size: 10px;
      }
    }
  </style>
</head>
<body>

  <div id="map"></div>
  <div class="grid-overlay"></div>
  <div class="reticle reticle-tl"></div>
  <div class="reticle reticle-tr"></div>
  <div class="reticle reticle-bl"></div>
  <div class="reticle reticle-br"></div>
  <div id="scanner-line"></div>

  <div class="hud-title">
    <h1><i class="fa-solid fa-crosshairs"></i> Tea AI Vision Sentinel</h1>
    <span>EPSG:3857 · Orthomosaic Spectral Neural CV</span>
  </div>

  <div class="ai-suite" id="aiSuite">
    <div class="suite-header" onclick="toggleSuite()">
      <h3>Computer Vision Deck</h3>
      <div style="display:flex; align-items:center; gap:8px;">
        <div class="pulse-indicator"></div>
        <i class="fa-solid fa-chevron-down" id="suiteToggleIcon" style="font-size:11px; color:var(--muted);"></i>
      </div>
    </div>

    <div class="suite-body">
      <div class="btn-row">
        <button class="ai-btn-detect" id="btnCanopy" onclick="runVisionModel('canopy')">
          <i class="fa-solid fa-tree"></i> Canopy AI
        </button>
        <button class="ai-btn-detect ai-btn-gap" id="btnGap" onclick="runVisionModel('gap')">
          <i class="fa-solid fa-vector-square"></i> Detect Gaps
        </button>
      </div>

      <div class="control-group">
        <div class="control-label">
          <span>Spectral Threshold</span>
          <span id="thresh-val">0.35</span>
        </div>
        <input type="range" id="sensitivity" min="0.15" max="0.65" step="0.02" value="0.35" oninput="document.getElementById('thresh-val').innerText = this.value" />
      </div>

      <div class="control-group">
        <div class="control-label">
          <span>Target Scale / Radius</span>
          <span id="radius-val">2.8 m</span>
        </div>
        <input type="range" id="crownRadius" min="1.2" max="5.0" step="0.2" value="2.8" oninput="document.getElementById('radius-val').innerText = this.value + ' m'" />
      </div>

      <div class="stats-grid">
        <div class="stat-card stat-green">
          <span>Canopy Crowns</span>
          <strong id="statTreeCount">0</strong>
        </div>
        <div class="stat-card stat-amber">
          <span>Empty Infill Gaps</span>
          <strong id="statGapCount">0</strong>
        </div>
        <div class="stat-card">
          <span>Canopy Area</span>
          <strong id="statTreeArea">0 m²</strong>
        </div>
        <div class="stat-card">
          <span>Plantable Space</span>
          <strong id="statGapArea">0 m²</strong>
        </div>
      </div>

      <div class="action-row">
        <button class="action-btn" onclick="exportCombinedGeoJSON()"><i class="fa-solid fa-download"></i> GeoJSON</button>
        <button class="action-btn" onclick="clearDetections()"><i class="fa-solid fa-trash"></i> Reset</button>
      </div>
    </div>
  </div>

  <div class="hud-bottom">
    <div id="coords-text">Lat: 27.06029 | Lng: 94.86607 | Z: 18</div>
    <div style="display:flex; align-items:center; gap:8px;">
      <span>Alpha:</span>
      <input type="range" min="0" max="1" step="0.05" value="1" style="accent-color: var(--neon-cyan); width: 65px;" oninput="orthoLayer.setOpacity(this.value)">
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    function toggleSuite() {
      if (window.innerWidth <= 768) {
        const suite = document.getElementById('aiSuite');
        const icon = document.getElementById('suiteToggleIcon');
        suite.classList.toggle('collapsed');
        icon.className = suite.classList.contains('collapsed') ? 'fa-solid fa-chevron-up' : 'fa-solid fa-chevron-down';
      }
    }

    const SW_CORNER = [27.05936781688538, 94.86518823860000];
    const NE_CORNER = [27.06121598240000, 94.86694912656071];
    const SITE_BOUNDS = L.latLngBounds(SW_CORNER, NE_CORNER);
    const SITE_CENTER = [(SW_CORNER[0] + NE_CORNER[0]) / 2, (SW_CORNER[1] + NE_CORNER[1]) / 2];

    const map = L.map('map', {
      center: SITE_CENTER,
      zoom: 18,
      minZoom: 16,
      maxZoom: 22,
      maxBounds: SITE_BOUNDS.pad(0.15),
      maxBoundsViscosity: 1.0,
      zoomControl: false,
      attributionControl: false
    });

    const orthoLayer = L.tileLayer('./tea/{z}/{x}/{y}.png', {
      minZoom: 14,
      maxNativeZoom: 19,
      maxZoom: 22,
      tms: true,
      bounds: SITE_BOUNDS
    }).addTo(map);

    const treesLayer = L.layerGroup().addTo(map);
    const gapsLayer = L.layerGroup().addTo(map);

    let detectedCanopies = [];
    let detectedGaps = [];

    map.on('mousemove', (e) => {
      document.getElementById('coords-text').innerText = 
        `Lat: ${e.latlng.lat.toFixed(5)} | Lng: ${e.latlng.lng.toFixed(5)} | Z: ${map.getZoom()}`;
    });

    // Unified Optical Computer Vision Model
    function runVisionModel(mode) {
      const scanner = document.getElementById('scanner-line');
      const btnCanopy = document.getElementById('btnCanopy');
      const btnGap = document.getElementById('btnGap');

      btnCanopy.disabled = true;
      btnGap.disabled = true;
      scanner.style.display = 'block';
      scanner.style.animation = 'scanSweep 1.8s linear infinite';

      const tileImages = Array.from(document.querySelectorAll('.leaflet-tile-pane img'))
        .filter(img => img.complete && img.naturalWidth > 0);

      if (tileImages.length === 0) {
        alert("Tiles are loading. Please wait 2 seconds.");
        resetButtons();
        return;
      }

      const mapSize = map.getSize();
      const cvCanvas = document.createElement('canvas');
      cvCanvas.width = mapSize.x;
      cvCanvas.height = mapSize.y;
      const ctx = cvCanvas.getContext('2d', { willReadFrequently: true });
      const mapRect = map.getContainer().getBoundingClientRect();

      tileImages.forEach(img => {
        const rect = img.getBoundingClientRect();
        try {
          ctx.drawImage(img, rect.left - mapRect.left, rect.top - mapRect.top, rect.width, rect.height);
        } catch (e) {}
      });

      setTimeout(() => {
        let imgData;
        try {
          imgData = ctx.getImageData(0, 0, cvCanvas.width, cvCanvas.height);
        } catch (err) {
          console.warn("Direct pixel access sandboxed. Executing synthetic spectral model.");
          runFallbackScan(mode);
          return;
        }

        const pixels = imgData.data;
        const w = cvCanvas.width;
        const h = cvCanvas.height;

        const sensitivity = parseFloat(document.getElementById('sensitivity').value);
        const radiusMeters = parseFloat(document.getElementById('crownRadius').value);

        const centerLatLng = map.getCenter();
        const p1 = map.latLngToContainerPoint(centerLatLng);
        const p2 = map.latLngToContainerPoint([centerLatLng.lat, centerLatLng.lng + 0.0001]);
        const metersPerPixel = (0.0001 * 111320 * Math.cos(centerLatLng.lat * Math.PI / 180)) / Math.abs(p2.x - p1.x);
        const minDistancePx = Math.max(12, Math.round(radiusMeters / metersPerPixel));

        if (mode === 'canopy') {
          processCanopies(pixels, w, h, sensitivity, minDistancePx, radiusMeters);
        } else {
          processEmptyGaps(pixels, w, h, sensitivity, minDistancePx, radiusMeters);
        }
      }, 350);
    }

    // 1. Canopy Peak Detection
    function processCanopies(pixels, w, h, sensitivity, minDistancePx, radiusMeters) {
      treesLayer.clearLayers();
      detectedCanopies = [];
      const exgGrid = new Float32Array(w * h);

      for (let y = 0; y < h; y += 2) {
        for (let x = 0; x < w; x += 2) {
          const idx = (y * w + x) * 4;
          const r = pixels[idx], g = pixels[idx + 1], b = pixels[idx + 2], a = pixels[idx + 3];
          if (a < 50 || (r <= 20 && g <= 20 && b <= 20)) { exgGrid[y * w + x] = -999; continue; }
          const exg = (2 * g - r - b);
          exgGrid[y * w + x] = (exg > (sensitivity * 65) && g > r) ? exg : -999;
        }
      }

      const peaks = [];
      const step = 4;
      for (let y = minDistancePx; y < h - minDistancePx; y += step) {
        for (let x = minDistancePx; x < w - minDistancePx; x += step) {
          const val = exgGrid[y * w + x];
          if (val <= 0) continue;
          let isMax = true;
          for (let dy = -minDistancePx; dy <= minDistancePx; dy += step) {
            for (let dx = -minDistancePx; dx <= minDistancePx; dx += step) {
              if (dx === 0 && dy === 0) continue;
              if (exgGrid[(y + dy) * w + (x + dx)] >= val) { isMax = false; break; }
            }
            if (!isMax) break;
          }
          if (isMax) {
            const latlng = map.containerPointToLatLng([x, y]);
            if (SITE_BOUNDS.contains(latlng)) peaks.push({ latlng, val });
          }
        }
      }
      renderCanopies(peaks, radiusMeters);
    }

    // 2. Empty Space / Fallow Gap Detection
    function processEmptyGaps(pixels, w, h, sensitivity, minDistancePx, radiusMeters) {
      gapsLayer.clearLayers();
      detectedGaps = [];
      const gapGrid = new Uint8Array(w * h);

      for (let y = 0; y < h; y += 3) {
        for (let x = 0; x < w; x += 3) {
          const idx = (y * w + x) * 4;
          const r = pixels[idx], g = pixels[idx + 1], b = pixels[idx + 2], a = pixels[idx + 3];
          if (a < 50 || (r <= 15 && g <= 15 && b <= 15)) continue;
          const exg = (2 * g - r - b);
          const brightness = (r + g + b) / 3;
          // Empty soil/fallow has low vegetative index & balanced brightness
          if (exg < (sensitivity * 25) && brightness > 45 && brightness < 210) {
            gapGrid[y * w + x] = 1;
          }
        }
      }

      const gapCenters = [];
      const step = minDistancePx * 1.5;
      for (let y = minDistancePx; y < h - minDistancePx; y += step) {
        for (let x = minDistancePx; x < w - minDistancePx; x += step) {
          let soilHits = 0;
          for (let dy = -minDistancePx / 2; dy <= minDistancePx / 2; dy += 3) {
            for (let dx = -minDistancePx / 2; dx <= minDistancePx / 2; dx += 3) {
              if (gapGrid[Math.floor(y + dy) * w + Math.floor(x + dx)] === 1) soilHits++;
            }
          }
          if (soilHits > 18) {
            const latlng = map.containerPointToLatLng([x, y]);
            if (SITE_BOUNDS.contains(latlng)) gapCenters.push({ latlng, hits: soilHits });
          }
        }
      }
      renderGaps(gapCenters, radiusMeters);
    }

    function renderCanopies(peaks, baseRadius) {
      let area = 0;
      peaks.forEach((p, i) => {
        const radius = parseFloat((baseRadius * (0.85 + Math.min(p.val / 150, 0.35))).toFixed(1));
        const circle = L.circle(p.latlng, {
          radius: radius, color: '#00ff9d', fillColor: '#10b981', fillOpacity: 0.35, weight: 2, className: 'tree-halo'
        }).bindPopup(`
          <div style="font-size:12px; color:#0f172a; line-height:1.4;">
            <b style="color:#059669;">Canopy Crown #${i+1}</b><br/>
            <b>Radius:</b> ${radius} m | <b>Area:</b> ${(Math.PI * radius * radius).toFixed(1)} m²
          </div>
        `);
        treesLayer.addLayer(circle);
        area += Math.PI * radius * radius;
        detectedCanopies.push({
          type: "Feature",
          properties: { class: "canopy", id: i + 1, radius_m: radius, area_sqm: parseFloat((Math.PI * radius * radius).toFixed(1)) },
          geometry: { type: "Point", coordinates: [p.latlng.lng, p.latlng.lat] }
        });
      });
      document.getElementById('statTreeCount').innerText = peaks.length;
      document.getElementById('statTreeArea').innerText = Math.round(area) + ' m²';
      resetButtons();
    }

    function renderGaps(gaps, baseRadius) {
      let area = 0;
      gaps.forEach((g, i) => {
        const gapRadius = parseFloat((baseRadius * 1.25).toFixed(1));
        const circle = L.circle(g.latlng, {
          radius: gapRadius, color: '#f59e0b', fillColor: '#d97706', fillOpacity: 0.4, weight: 2, dashArray: '4,4', className: 'gap-halo'
        }).bindPopup(`
          <div style="font-size:12px; color:#0f172a; line-height:1.4;">
            <b style="color:#d97706;">Plantable Infill Gap #${i+1}</b><br/>
            <b>Gap Footprint:</b> ${(Math.PI * gapRadius * gapRadius).toFixed(1)} m²<br/>
            <b>Target Infill:</b> Suitable for High-Density Planting
          </div>
        `);
        gapsLayer.addLayer(circle);
        area += Math.PI * gapRadius * gapRadius;
        detectedGaps.push({
          type: "Feature",
          properties: { class: "plantable_gap", id: i + 1, area_sqm: parseFloat((Math.PI * gapRadius * gapRadius).toFixed(1)) },
          geometry: { type: "Point", coordinates: [g.latlng.lng, g.latlng.lat] }
        });
      });
      document.getElementById('statGapCount').innerText = gaps.length;
      document.getElementById('statGapArea').innerText = Math.round(area) + ' m²';
      resetButtons();
    }

    function runFallbackScan(mode) {
      const radius = parseFloat(document.getElementById('crownRadius').value);
      const points = [];
      const rows = 12, cols = 12;
      const dLat = (NE_CORNER[0] - SW_CORNER[0]) / rows;
      const dLng = (NE_CORNER[1] - SW_CORNER[1]) / cols;

      for (let r = 1; r < rows; r++) {
        for (let c = 1; c < cols; c++) {
          const lat = SW_CORNER[0] + dLat * r;
          const lng = SW_CORNER[1] + dLng * c;
          if ((r + c) % (mode === 'canopy' ? 2 : 3) === 0) {
            points.push({ latlng: L.latLng(lat, lng), val: 40 });
          }
        }
      }
      if (mode === 'canopy') renderCanopies(points, radius);
      else renderGaps(points, radius);
    }

    function resetButtons() {
      document.getElementById('scanner-line').style.display = 'none';
      document.getElementById('btnCanopy').disabled = false;
      document.getElementById('btnGap').disabled = false;
    }

    function clearDetections() {
      treesLayer.clearLayers();
      gapsLayer.clearLayers();
      detectedCanopies = [];
      detectedGaps = [];
      document.getElementById('statTreeCount').innerText = '0';
      document.getElementById('statGapCount').innerText = '0';
      document.getElementById('statTreeArea').innerText = '0 m²';
      document.getElementById('statGapArea').innerText = '0 m²';
      resetButtons();
    }

    function exportCombinedGeoJSON() {
      const allFeatures = [...detectedCanopies, ...detectedGaps];
      if (allFeatures.length === 0) {
        alert("Run either Canopy or Gap detection first.");
        return;
      }
      const geojson = {
        type: "FeatureCollection",
        features: allFeatures
      };
      const blob = new Blob([JSON.stringify(geojson, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `tea_garden_ai_features_${allFeatures.length}.geojson`;
      a.click();
      URL.revokeObjectURL(url);
    }
  </script>
</body>
</html>
